<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>si - 自己投資トラッキングアプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ログイン画面 -->
    <div id="login-screen" class="screen">
        <div class="container">
            <h1>si</h1>
            <p class="subtitle">自己投資を続ける</p>
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">ログイン</button>
                <button class="auth-tab" data-tab="register">新規登録</button>
            </div>
            
            <!-- ログインフォーム -->
            <div id="login-form" class="auth-form active">
                <input type="email" id="login-email" placeholder="メールアドレス" required>
                <input type="password" id="login-password" placeholder="パスワード" required>
                <button id="login-submit-btn" class="primary-btn">ログイン</button>
                <p class="error-message" id="login-error"></p>
            </div>
            
            <!-- 新規登録フォーム -->
            <div id="register-form" class="auth-form">
                <input type="email" id="register-email" placeholder="メールアドレス" required>
                <input type="password" id="register-password" placeholder="パスワード（8文字以上）" minlength="8" required>
                <input type="password" id="register-password-confirm" placeholder="パスワード（確認）" minlength="8" required>
                <input type="text" id="register-nickname" placeholder="ニックネーム" maxlength="20" required>
                <input type="text" id="register-username" placeholder="ユーザー名（@username）" maxlength="20" pattern="^[a-zA-Z0-9_]+$" required>
                <p class="input-hint">ユーザー名は半角英数字とアンダースコアのみ</p>
                <button id="register-submit-btn" class="primary-btn">登録</button>
                <p class="error-message" id="register-error"></p>
            </div>
        </div>
    </div>

    <!-- メインアプリ -->
    <div id="app-screen" class="screen hidden">
        <!-- ホーム画面 -->
        <div id="home-view" class="view active">
            <div class="container">
                <div class="stopwatch-section">
                    <div class="stopwatch-display" id="stopwatch">00:00:00</div>
                    <div class="stopwatch-controls">
                        <button id="start-btn" class="control-btn start-btn">開始</button>
                        <button id="stop-btn" class="control-btn stop-btn" disabled>停止</button>
                    </div>
                </div>

                <div class="today-records">
                    <h3>今日の記録</h3>
                    <div id="today-list"></div>
                    <div class="today-total" id="today-total">合計: 0時間0分</div>
                </div>
            </div>
        </div>

        <!-- コミュニティ画面 -->
        <div id="community-view" class="view">
            <div class="container">
                <div class="community-tabs">
                    <button class="tab-btn active" data-tab="recommended">おすすめ</button>
                    <button class="tab-btn" data-tab="following">フォロー中</button>
                </div>

                <div id="posts-container"></div>
            </div>
        </div>

        <!-- ダッシュボード画面 -->
        <div id="dashboard-view" class="view">
            <div class="container">
                <div class="dashboard-header">
                    <div class="week-total">
                        <h2>今週の累計時間</h2>
                        <div class="large-number" id="week-total">0時間0分</div>
                    </div>
                    <div class="streak">
                        <span id="streak-days">連続0日間</span>
                    </div>
                </div>

                <div class="goal-section">
                    <div class="section-header">
                        <h3>週間目標</h3>
                    </div>
                    <div id="progress-list"></div>
                </div>

                <div class="chart-section">
                    <h3>週間推移グラフ</h3>
                    <canvas id="week-chart"></canvas>
                </div>
            </div>
        </div>

        <!-- 目標設定画面 -->
        <div id="goal-settings-view" class="view">
            <div class="container">
                <div class="view-header">
                    <button id="back-to-dashboard" class="back-btn">← 戻る</button>
                    <h2>週間目標設定</h2>
                </div>
                <div id="goal-form"></div>
                <button id="save-goals-btn" class="primary-btn">保存</button>
            </div>
        </div>

        <!-- ボトムナビゲーション -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-view="home">
                <span class="nav-label">ホーム</span>
            </button>
            <button class="nav-btn" data-view="community">
                <span class="nav-label">コミュニティ</span>
            </button>
            <button class="nav-btn" data-view="dashboard">
                <span class="nav-label">ダッシュボード</span>
            </button>
        </nav>
    </div>

    <!-- カテゴリ選択モーダル -->
    <div id="category-modal" class="modal hidden">
        <div class="modal-content">
            <h3>計測時間: <span id="recorded-time">0分</span></h3>
            <h4>カテゴリを選択</h4>
            <select id="category-select">
                <option value="">選択してください</option>
            </select>
            <div class="new-category">
                <input type="text" id="new-category-input" placeholder="新しいカテゴリ名" maxlength="20">
                <button id="add-category-btn" class="secondary-btn">+ 追加</button>
            </div>
            <h4>一言（任意）</h4>
            <textarea id="post-text" placeholder="今日の感想を書く..." maxlength="100"></textarea>
            <div class="post-options">
                <label>
                    <input type="checkbox" id="post-public" checked>
                    <span>コミュニティに投稿する</span>
                </label>
            </div>
            <button id="save-record-btn" class="primary-btn" disabled>保存</button>
        </div>
    </div>

    <!-- コメントモーダル -->
    <div id="comment-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>コメント</h3>
                <button class="close-btn" id="close-comment-modal">✕</button>
            </div>
            <div id="comment-list"></div>
            <div class="comment-input">
                <input type="text" id="comment-text" placeholder="コメントを入力..." maxlength="100">
                <button id="post-comment-btn" class="secondary-btn">送信</button>
            </div>
        </div>
    </div>

    <!-- Supabase JavaScript SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config.js"></script>
    <script src="./supabase-client.js"></script>
    <script src="./app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</body>
</html>
